<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Virtual Office — 3D Office</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dce8f4;color:#17263a;font:13px Inter,system-ui,sans-serif}canvas{display:block;width:100%;height:100%;outline:0}#hud{position:absolute;left:12px;top:12px;display:flex;gap:7px;flex-wrap:wrap;max-width:calc(100% - 24px);pointer-events:none}.chip{background:#0b1426df;border:1px solid #46608088;border-radius:10px;padding:7px 10px;backdrop-filter:blur(12px);font-size:10px;box-shadow:0 5px 20px #0005}.chip b{color:#69e2d4}#panel{position:absolute;right:12px;top:12px;width:min(245px,48%);background:#0b1426ed;border:1px solid #46608099;border-radius:14px;padding:12px;backdrop-filter:blur(14px);box-shadow:0 10px 30px #0006}#panel strong{font-size:13px}#panel p{color:#aabbd4;font-size:11px;line-height:1.45;margin:6px 0 0}#controls{position:absolute;left:12px;bottom:12px;background:#0b1426dd;border:1px solid #46608088;border-radius:10px;padding:8px 10px;color:#c5d3e8;font-size:10px;max-width:calc(100% - 100px)}#reset{position:absolute;right:12px;bottom:12px;border:1px solid #56749c;background:#1b3150;color:#fff;border-radius:10px;padding:9px 12px;font-weight:750}#loading{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse,#f8fcff,#dce8f4);color:#203b59;font-weight:700;letter-spacing:.08em;z-index:5}#error{display:none;position:absolute;inset:15px;background:#241722;border:1px solid #78465b;border-radius:14px;padding:18px;color:#ffe3eb;z-index:6;white-space:pre-wrap}

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head><body>
<div id="loading">VIRTUAL OFFICE · OFIS YUKLANMOQDA…</div><div id="error"></div><canvas id="scene"></canvas>
<div id="hud"><div class="chip"><b>VIRTUAL OFFICE</b></div><div class="chip">10 AI XODIM</div><div class="chip">KUNDUZGI ISH MUHITI</div><div class="chip">LIVE SIMULATION</div></div>
<div id="panel"><strong id="pname">Virtual Office bosh ofisi</strong><p id="pdesc">Xodim ustiga bosing — uning profili, bo‘limi va joriy faoliyatini ko‘ring.</p></div>
<div id="controls">Sichqoncha/barmoq: aylantirish · G‘ildirak: zoom · Xodimni bosing: profil</div><button id="reset">Kamerani tiklash</button>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
const $=s=>document.querySelector(s);const canvas=$('#scene');
try{
 const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;
 const scene=new THREE.Scene();scene.background=new THREE.Color('#dce8f4');scene.fog=new THREE.Fog('#dce8f4',55,100);
 const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.1,100);camera.position.set(25,27,29);
 const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.2,0);controls.enableDamping=true;controls.dampingFactor=.06;controls.maxPolarAngle=Math.PI/2.08;controls.minDistance=18;controls.maxDistance=58;
 scene.add(new THREE.HemisphereLight(0xffffff,0x9aa9b8,2.0));const ambient=new THREE.AmbientLight(0xffffff,1.05);scene.add(ambient);
 const moon=new THREE.DirectionalLight(0xfff4df,2.25);moon.position.set(-9,18,9);moon.castShadow=true;moon.shadow.mapSize.set(1536,1536);moon.shadow.camera.left=-17;moon.shadow.camera.right=17;moon.shadow.camera.top=17;moon.shadow.camera.bottom=-17;scene.add(moon);
 const mat=(c,r=.72,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const floor=mat('#c8d5e2'),wall=mat('#e8eef4'),dark=mat('#34465b'),metal=mat('#8295a8',.35,.45),wood=mat('#9a765b'),glass=new THREE.MeshStandardMaterial({color:'#4c8ca9',roughness:.16,metalness:.35,transparent:true,opacity:.36}),carpet=mat('#dce6ef'),skin=mat('#d6a783');
 const box=(p,x,y,z,w,h,d,m)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;p.add(o);return o};
 const glow=(color,intensity=2)=>new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:intensity,roughness:.35});
 // Floating architectural foundation
 box(scene,0,-.42,0,25,.8,19,mat('#9eafbf'));box(scene,0,.02,0,24.6,.12,18.6,floor);
 // Dark polished floor panels
 for(let x=-8;x<=8;x+=2)for(let z=-5.5;z<=5.5;z+=2)box(scene,x,.09,z,1.94,.018,1.94,mat((Math.round(x+z)%4===0)?'#e6edf4':'#d5e0e9'));
 // perimeter walls, open front for clear isometric view
 box(scene,0,1.15,-6.65,18.4,2.3,.22,wall);box(scene,-9.15,1.15,0,.22,2.3,13.2,wall);box(scene,9.15,1.15,0,.22,2.3,13.2,wall);box(scene,0,1.15,6.65,5.4,2.3,.22,wall);
 // luminous windows on rear wall
 for(let x=-7.5;x<=7.6;x+=2.5){box(scene,x,1.55,-6.51,1.8,1.25,.045,glass);box(scene,x,2.22,-6.47,1.82,.045,.07,glow('#54b8e8',1.4));}
 // partitions and department rugs
 const zones=[['MANAGER',-6,-3.9,'#243b5c'],['RESEARCH',-1.8,-3.9,'#263d50'],['DEVELOPMENT',3.4,-3.9,'#253854'],['DESIGN',-6,3.6,'#3a304b'],['CONTROLLER',-1.5,3.6,'#3b3540'],['MEETING',4.1,3.6,'#29364d']];
 zones.forEach(([n,x,z,c])=>{box(scene,x,.13,z,4.8,.035,4.5,mat(c));});
 // low glass partitions, door gaps kept open
 box(scene,-3.8,.72,-3.9,.09,1.35,4.7,glass);box(scene,1,.72,-3.9,.09,1.35,4.7,glass);box(scene,-6,.72,-.95,4.6,1.35,.09,glass);box(scene,3.8,.72,-.95,4.8,1.35,.09,glass);box(scene,-3.8,.72,3.55,.09,1.35,4.8,glass);box(scene,1.1,.72,3.55,.09,1.35,4.8,glass);
 // department name plaques
 function plaque(text,x,z){const c=document.createElement('canvas');c.width=512;c.height=100;const g=c.getContext('2d');g.fillStyle='#0b1728';g.strokeStyle='#5a83ad';g.lineWidth=5;g.roundRect(5,5,502,90,18);g.fill();g.stroke();g.fillStyle='#bfe6ff';g.font='bold 36px system-ui';g.textAlign='center';g.fillText(text,256,62);const tx=new THREE.CanvasTexture(c);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,transparent:true}));s.position.set(x,2.65,z);s.scale.set(3.1,.62,1);scene.add(s);return s}zones.forEach(z=>plaque(z[0],z[1],z[2]));
 // warm ceiling strips / hanging lights
 for(const [x,z] of [[-6,-4],[-1.8,-4],[3.4,-4],[-6,3.6],[-1.5,3.6],[4.1,3.6]]){box(scene,x,2.28,z,2.8,.045,.13,glow('#fff0c2',1.8));const l=new THREE.PointLight('#fff0cf',1.5,7,2);l.position.set(x,2.05,z);scene.add(l)}
 // furniture helpers
 function desk(x,z,rot=0){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;scene.add(g);box(g,0,.72,0,1.45,.13,.78,wood);for(const a of [-.58,.58])for(const b of [-.29,.29])box(g,a,.36,b,.065,.7,.065,metal);box(g,0,1.16,-.22,.67,.48,.065,dark);box(g,0,1.17,-.18,.56,.35,.018,glow('#4e9fd1',.5));box(g,.42,.79,.13,.24,.12,.25,metal);const chair=new THREE.Group();chair.position.set(0,0,.88);g.add(chair);box(chair,0,.48,0,.48,.12,.48,mat('#263b58'));box(chair,0,.82,.22,.48,.62,.12,mat('#263b58'));return g}
 const deskSpots=[[-7,-4.6],[-5.2,-3.3],[-2.7,-4.6],[-.9,-3.1],[2.1,-4.6],[4.1,-3.1],[-7,3],[-5.1,4.3],[-2.7,3],[ -.8,4.3],[2.2,3],[4.2,4.3]];deskSpots.forEach((p,i)=>desk(p[0],p[1],i%2?Math.PI:0));
 // meeting table and chairs
 const mt=new THREE.Mesh(new THREE.CylinderGeometry(1.25,1.25,.18,32),wood);mt.position.set(4.3,.78,3.65);mt.castShadow=true;scene.add(mt);for(let i=0;i<6;i++){const a=i*Math.PI/3;box(scene,4.3+Math.cos(a)*1.65,.42,3.65+Math.sin(a)*1.25,.42,.72,.42,metal)}
 // reception desk, server racks
 box(scene,-8,.58,-.2,1.5,1,.72,wood);box(scene,-8,1.12,-.2,1.3,.07,.56,glow('#4ca7d6',.7));for(let i=0;i<3;i++){box(scene,7.9,.95,-5.25+i*.85,.48,1.7,.58,dark);for(let j=0;j<4;j++)box(scene,7.9,.35+j*.38,-5.56+i*.85,.16,.075,.025,glow(j%2?'#46d8c0':'#5797ff',2.5))}plaque('RECEPTION',-7.9,.45);plaque('SERVER ROOM',7.7,-4.7);
 // plants
 const green=mat('#287e68');function plant(x,z){const pot=new THREE.Mesh(new THREE.CylinderGeometry(.22,.29,.38,12),mat('#704f42'));pot.position.set(x,.25,z);scene.add(pot);for(let i=0;i<6;i++){const leaf=new THREE.Mesh(new THREE.SphereGeometry(.15,9,8),green);leaf.scale.set(.7,1.8,.7);leaf.position.set(x+Math.cos(i)*.17,.7+Math.sin(i*.8)*.08,z+Math.sin(i)*.17);scene.add(leaf)}}[[-8.5,-5.8],[8.5,-5.8],[-8.5,5.8],[8.5,5.8],[-3,0],[2,0]].forEach(p=>plant(...p));
 // human-like low-poly game characters, with animated legs and arms
 const people=[];const staff=[['AI direktor','Boshqaruv','Director',-7,-4.6,'#4f8bd1'],['Biznes tahlilchi','Research','Analyst',-2.7,-4.6,'#b68b5d'],['Research agent','Research','Research',-.9,-3.1,'#4d9c91'],['Dasturchi','Development','Developer',2.1,-4.6,'#638bd0'],['Dizayner','Design','Designer',-7,3,'#bd7da8'],['QA sinovchi','Controller','Controller',-2.7,3,'#c69a58'],['Marketing mutaxassisi','Marketing','Marketing',4.1,-3.1,'#55a7b7'],['Kontent mutaxassisi','Design','Content',-5.1,4.3,'#9c83c9'],['Moliya mutaxassisi','Finance','Finance',-.8,4.3,'#78a66e'],['Project manager','Meeting','Project',2.2,3,'#879bb8']];
 function human(data){const [name,dept,job,x,z,color]=data;const root=new THREE.Group();root.position.set(x,.11,z);scene.add(root);const rig=new THREE.Group();root.add(rig);const shirt=mat(color),pants=mat('#26354b'),shoe=mat('#111b2b');const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.22,.42,5,9),shirt);torso.position.y=.94;torso.scale.set(.9,1,.68);rig.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.17,14,12),skin);head.position.y=1.43;head.scale.set(.9,1.12,.9);rig.add(head);const hair=new THREE.Mesh(new THREE.SphereGeometry(.175,12,8,0,Math.PI*2,0,Math.PI*.52),mat('#293044'));hair.position.set(0,1.49,-.015);rig.add(hair);const limbs=[];for(const side of [-1,1]){const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.075,.34,4,8),pants);leg.position.set(side*.115,.39,0);rig.add(leg);const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.065,.3,4,8),shirt);arm.position.set(side*.27,.98,0);arm.rotation.z=side*.18;rig.add(arm);limbs.push({leg,arm,side});const foot=new THREE.Mesh(new THREE.BoxGeometry(.14,.09,.24),shoe);foot.position.set(side*.115,.12,.06);rig.add(foot)}const marker=new THREE.Mesh(new THREE.CircleGeometry(.32,24),new THREE.MeshBasicMaterial({color:'#54d7c5',transparent:true,opacity:.28,side:THREE.DoubleSide}));marker.rotation.x=-Math.PI/2;marker.position.y=.105;root.add(marker);root.userData={name,dept,job,limbs,marker,baseX:x,baseZ:z,phase:Math.random()*6.28,walking:false};people.push(root);return root}
 staff.forEach(human);
 // subtle neon exterior signage and path lights
 const sign=plaque('VIRTUAL OFFICE',0,-6.95);sign.position.y=3.05;sign.scale.set(4.3,.72,1);
 for(let i=0;i<8;i++){const x=-7+i*2;const lamp=new THREE.PointLight('#4c9cff',.28,3);lamp.position.set(x,.5,6.2);scene.add(lamp)}
 // Kengroq ko‘rinish: butun ofis maydoni proporsional kattalashtiriladi.
 const world=new THREE.Group();while(scene.children.length)world.add(scene.children[0]);scene.add(world);world.scale.setScalar(1.38);
 // raycast selection includes all child meshes
 const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(people,true)[0];if(hit){let p=hit.object;while(p&&!p.userData.name)p=p.parent;if(p){$('#pname').textContent=p.userData.name;$('#pdesc').textContent=p.userData.dept+' bo‘limi · '+p.userData.job+' · '+(p.userData.walking?'Boshqa ish joyiga yo‘l olmoqda':'Ish jarayonida')+'. AI ulanishi keyingi bosqichda.'}}});
 $('#reset').onclick=()=>{camera.position.set(25,27,29);controls.target.set(0,0,0);controls.update()};
 // Deterministic short walking routes: workers walk between their desks and shared work points.
 const routes=[[-7,-4.6,-5.6,-3.3],[-2.7,-4.6,-1.5,-2.4],[-.9,-3.1,.2,-2.2],[2.1,-4.6,3.2,-2.4],[-7,3,-5.8,2.1],[-2.7,3,-1.5,2.1],[4.1,-3.1,5.3,-2.1],[-5.1,4.3,-4.2,2.4],[-.8,4.3,.1,2.3],[2.2,3,3.2,2.3]];
 const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();people.forEach((p,i)=>{const u=(Math.sin(t*.22+p.userData.phase)+1)/2;const [x1,z1,x2,z2]=routes[i];const walk=u>.86||u<.04;p.userData.walking=walk;const k=(Math.sin(t*.22+p.userData.phase)+1)/2;p.position.x=THREE.MathUtils.lerp(x1,x2,k);p.position.z=THREE.MathUtils.lerp(z1,z2,k);p.position.y=.11;p.rotation.y=Math.atan2(x2-x1,z2-z1)+(k>.5?Math.PI:0);const swing=walk?Math.sin(t*7+i)*.48:Math.sin(t*1.7+i)*.035;p.userData.limbs.forEach(l=>{l.leg.rotation.x=swing*l.side;l.arm.rotation.x=-swing*l.side*.65});p.userData.marker.material.opacity=walk?.48:.2;p.userData.marker.scale.setScalar(walk?1.25:1);});controls.update();renderer.render(scene,camera)}
 animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8))});$('#loading').style.display='none';
}catch(err){console.error(err);$('#loading').style.display='none';$('#error').style.display='block';$('#error').textContent='3D ofisni yuklashda xatolik.\n\n'+(err?.stack||err)+'\n\nInternet aloqasini va WebGL qo‘llab-quvvatlanishini tekshiring.'}
</script></body></html>
