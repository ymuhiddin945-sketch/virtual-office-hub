<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAXIYA 3D Office</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;color:#eef4ff;font:13px system-ui}#scene{width:100%;height:100%;display:block}#hud{position:absolute;left:12px;top:12px;display:flex;gap:7px;flex-wrap:wrap;max-width:calc(100% - 24px);pointer-events:none}.chip{background:#101d31df;border:1px solid #52688788;border-radius:10px;padding:7px 10px;backdrop-filter:blur(10px);font-size:11px}.chip b{color:#75e2d5}#panel{position:absolute;right:12px;top:12px;width:min(230px,45%);background:#101d31e8;border:1px solid #52688788;border-radius:13px;padding:12px;backdrop-filter:blur(10px)}#panel strong{font-size:13px}#panel p{color:#aabbd4;font-size:11px;margin:5px 0}#controls{position:absolute;left:12px;bottom:12px;background:#101d31d9;border:1px solid #52688788;border-radius:10px;padding:8px 10px;color:#c5d3e8;font-size:10px}#reset{position:absolute;right:12px;bottom:12px;border:1px solid #50698c;background:#203755;color:#fff;border-radius:9px;padding:9px 12px;font-weight:700}</style></head><body><canvas id="scene"></canvas><div id="hud"><div class="chip"><b>MAXIYA</b> · VIRTUAL HQ</div><div class="chip">10 AI xodim</div><div class="chip">6 ta bo‘lim</div><div class="chip">Stage 9 · 3D Preview</div></div><div id="panel"><strong id="pname">MAXIYA bosh ofisi</strong><p id="pdesc">Xodim ustiga bosing — uning bo‘limi va vazifasini ko‘ring.</p></div><div id="controls">Sichqoncha: aylantirish · G‘ildirak: zoom · Barmoq: boshqarish</div><button id="reset">Kamerani tiklash</button><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
const canvas=document.querySelector('#scene'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;
const scene=new THREE.Scene();scene.background=new THREE.Color('#172235');scene.fog=new THREE.Fog('#172235',22,42);const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,100);camera.position.set(15,17,19);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI/2.08;controls.minDistance=10;controls.maxDistance=32;
scene.add(new THREE.HemisphereLight(0xdceaff,0x6e765f,2));const sun=new THREE.DirectionalLight(0xffedcf,3.1);sun.position.set(-8,18,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-16;sun.shadow.camera.right=16;sun.shadow.camera.top=16;sun.shadow.camera.bottom=-16;scene.add(sun);
const mat=(c,r=.8)=>new THREE.MeshStandardMaterial({color:c,roughness:r});const floorMat=mat('#e8dfce'),wallMat=mat('#d6dce1'),wood=mat('#b77c4d'),dark=mat('#26374b'),metal=mat('#65798d'),glass=new THREE.MeshStandardMaterial({color:'#8bc7d9',transparent:true,opacity:.28,roughness:.18}),green=mat('#4f956e');
function box(parent,x,y,z,w,h,d,m){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}function label(text,x,z,color='#26374b'){let c=document.createElement('canvas');c.width=512;c.height=128;let g=c.getContext('2d');g.fillStyle='rgba(255,255,255,.92)';g.roundRect(8,8,496,112,18);g.fill();g.fillStyle=color;g.font='bold 42px system-ui';g.textAlign='center';g.fillText(text,256,78);let tx=new THREE.CanvasTexture(c);let s=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,transparent:true}));s.position.set(x,2.65,z);s.scale.set(3.3,.83,1);scene.add(s);return s}
// Raised office base and clean floor
box(scene,0,-.35,0,18,.7,13,mat('#34475d'));box(scene,0,.03,0,17.6,.12,12.6,floorMat);
// Perimeter walls, deliberately low to keep interior visible
box(scene,0,.78,-6.15,17.5,1.5,.22,wallMat);box(scene,-8.65,.78,0,.22,1.5,12.4,wallMat);box(scene,8.65,.78,0,.22,1.5,12.4,wallMat);box(scene,0,.78,6.15,17.5,1.5,.22,wallMat);
// accent glass panels on back wall
for(let x=-6.7;x<=6.8;x+=2.25){box(scene,x,.95,-6.02,1.45,.92,.035,glass)}
// Room partitions with open walkways
box(scene,-3.0,.58,-2.0,.12,1.1,3.0,wallMat);box(scene,2.8,.58,-2.0,.12,1.1,3.0,wallMat);box(scene,-5.7,.58,1.2,3.1,1.1,.12,wallMat);box(scene,5.6,.58,1.2,3.2,1.1,.12,wallMat);box(scene,0,.58,3.2,5.4,1.1,.12,wallMat);
// department zones
const zones=[['MANAGER',-5.6,-3.8,'#d9e8ff'],['RESEARCH',0,-3.8,'#e5f0df'],['DEVELOPMENT',5.5,-3.8,'#e1e8f8'],['DESIGN',-5.5,3.7,'#f5e6d8'],['CONTROLLER',0,4.65,'#e4e8ef'],['MEETING',5.5,3.7,'#e5e0f4']];zones.forEach(([n,x,z,c])=>{box(scene,x,.105,z,2.7,.025,2.0,mat(c));label(n,x,z)});
// desks with monitor and chair
function desk(x,z,rot=0){let g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;scene.add(g);box(g,0,.68,0,1.35,.12,.72,wood);for(let a of [-.55,.55])for(let b of [-.27,.27])box(g,a,.32,b,.07,.65,.07,metal);box(g,0,1.08,-.18,.58,.42,.055,dark);box(g,0,1.1,-.145,.48,.31,.018,mat('#5aa9c8'));box(g,.42,.76,.1,.25,.12,.25,metal);let chair=box(g,0,.36,.72,.48,.12,.48,mat('#455c75'));box(g,0,.72,.94,.45,.58,.12,mat('#455c75'));return g}
const desks=[[-5.9,-4.1],[-4.9,-2.9],[-.9,-4.2],[.8,-2.9],[4.6,-4.2],[6.2,-2.9],[-6.2,3.6],[-4.7,4.5],[-.9,4.4],[1,4.4],[4.7,3.4],[6.2,4.5]];desks.forEach((p,i)=>desk(p[0],p[1],i%2?Math.PI:0));
// meeting table and chairs
let table=new THREE.Mesh(new THREE.CylinderGeometry(1.15,1.15,.16,32),wood);table.position.set(5.4,.75,3.7);table.castShadow=true;scene.add(table);for(let i=0;i<6;i++){let a=i*Math.PI/3;box(scene,5.4+Math.cos(a)*1.55,.45,3.7+Math.sin(a)*1.15,.42,.75,.42,metal)}
// reception and server rack
box(scene,-7.15,.52,-.4,1.7,.9,.65,wood);box(scene,-7.15,1.1,-.4,1.4,.08,.5,mat('#e8c9a8'));for(let i=0;i<3;i++){box(scene,7.6,.8,-4.9+i*.9,.42,1.35,.55,dark);for(let j=0;j<3;j++)box(scene,7.6,.45+j*.35,-5.12+i*.9,.13,.07,.025,mat(j===1?'#4dd7c5':'#5b91ff'))}label('RECEPTION',-7.1,.6);label('SERVER',7.45,-4.7);
// indoor plants
function plant(x,z){let pot=new THREE.Mesh(new THREE.CylinderGeometry(.22,.28,.4,12),wood);pot.position.set(x,.25,z);scene.add(pot);for(let i=0;i<5;i++){let leaf=new THREE.Mesh(new THREE.SphereGeometry(.16,8,8),green);leaf.scale.set(.7,1.8,.7);leaf.position.set(x+Math.cos(i*1.25)*.18,.72+Math.sin(i)*.12,z+Math.sin(i*1.25)*.18);scene.add(leaf)}}[[-8,-5.4],[8,-5.4],[-8,5.4],[8,5.4],[-2,0],[2,0]].forEach(p=>plant(...p));
// small stylized but proportioned office people
const people=[];const staff=[['Director','AI direktor','#547fba',-5.9,-4.1],['Analyst','Biznes tahlilchi','#bd8b54',-.9,-4.2],['Research','Research agent','#5c9b8d',.8,-2.9],['Developer','Dasturchi','#6387c9',4.6,-4.2],['Designer','Dizayner','#bb7f9d',-6.2,3.6],['Controller','QA sinovchi','#bf9651',-.9,4.4],['Marketing','Marketing mutaxassisi','#5a9eaf',6.2,-2.9],['Content','Kontent mutaxassisi','#9a7dbb',-4.7,4.5],['Finance','Moliya mutaxassisi','#729a70',1,4.4],['Project','Project manager','#8c9cb5',6.2,4.5]];
function person(name,role,color,x,z){let g=new THREE.Group();g.position.set(x,.05,z);scene.add(g);let skin=mat('#d6a783'),shirt=mat(color),pants=mat('#34445a'),head=new THREE.Mesh(new THREE.SphereGeometry(.19,16,12),skin);head.position.y=1.42;head.scale.set(.88,1.08,.88);g.add(head);let body=new THREE.Mesh(new THREE.CapsuleGeometry(.22,.48,5,10),shirt);body.position.y=.91;body.scale.set(.9,1,.65);g.add(body);for(let dx of [-.12,.12]){let leg=new THREE.Mesh(new THREE.CapsuleGeometry(.075,.36,4,8),pants);leg.position.set(dx,.35,0);g.add(leg)}let badge=new THREE.Mesh(new THREE.SphereGeometry(.045,8,8),mat('#f5d36e'));badge.position.set(0,1.0,.19);g.add(badge);g.userData={name,role};people.push(g);return g}
staff.forEach(s=>person(...s));
// floor markings and corridor
for(let z=-5.4;z<=5.4;z+=.6){box(scene,0,.105,z,.045,.012,.25,mat('#b6b2a7'))}
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();function select(e){let r=canvas.getBoundingClientRect();mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(mouse,camera);let hits=ray.intersectObjects(people,true);if(hits.length){let o=hits[0].object;while(o&&!o.userData.name)o=o.parent;if(o){document.querySelector('#pname').textContent=o.userData.name;document.querySelector('#pdesc').textContent=o.userData.role+' · Virtual xodim profili. AI integratsiyasi keyingi bosqichda ulanadi.'}}}canvas.addEventListener('pointerdown',select);document.querySelector('#reset').onclick=()=>{camera.position.set(15,17,19);controls.target.set(0,0,0);controls.update()};
// gentle idle animation and tiny walking shifts around assigned desk
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);let t=clock.getElapsedTime();people.forEach((p,i)=>{p.position.y=.05+Math.sin(t*2+i)*.018;p.rotation.y=Math.sin(t*.35+i)*.08});controls.update();renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2))});
</script></body></html>
